{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if mode == "activate" %}Ativar conta{% else %}Recuperar senha{% endif %} | Reali</title>
  <link rel="stylesheet" href="{% static 'reali/account.css' %}">
  <script src="{% static 'reali/account.js' %}" defer></script>
</head>
<body>
  <main data-mode="{{ mode }}">
    <p class="brand">Reali</p>
    <h1>{% if mode == "activate" %}Ative sua conta{% else %}Defina uma nova senha{% endif %}</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript>Ative o JavaScript para continuar com segurança.</noscript>
    <form id="password-form" hidden>
      {% if mode == "activate" %}
      <label>Nome completo <input name="full_name" maxlength="160" autocomplete="name" required></label>
      {% endif %}
      <label>Nova senha <input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
      <label>Confirme a senha <input type="password" name="password_confirmation" autocomplete="new-password" minlength="12" maxlength="256" required></label>
      <button type="submit">{% if mode == "activate" %}Ativar minha conta{% else %}Salvar nova senha{% endif %}</button>
    </form>
    {% if mode == "activate" %}
    <form id="login-form" hidden>
      <label>E-mail da conta convidada <input type="email" name="email" autocomplete="username" maxlength="254" required></label>
      <label>Senha atual <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar e aceitar convite</button>
    </form>
    <button id="existing-account" type="button" hidden>Já tenho conta</button>
    {% endif %}
  </main>
</body>
</html>

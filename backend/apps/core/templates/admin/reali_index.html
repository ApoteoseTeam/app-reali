{% extends "admin/index.html" %}
{% load static %}

{% block extrastyle %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'reali/operations.css' %}">
{% endblock %}

{% block content %}
  {% if operations_cards %}
    <section aria-label="Resumo operacional" class="reali-operations">
      {% for card in operations_cards %}
        <a href="{{ card.url }}">
          <span>{{ card.title }}</span>
          <strong>{{ card.value }}</strong>
        </a>
      {% endfor %}
    </section>
  {% endif %}
  {{ block.super }}
{% endblock %}

name: Reali quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_load:
        description: Executar carga sintética no PostgreSQL isolado
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reali-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_DB: reali_ci
      POSTGRES_USER: reali
      POSTGRES_PASSWORD: ci-local-postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: reali_ci
          POSTGRES_USER: reali
          POSTGRES_PASSWORD: ci-local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reali -d reali_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          python -m pip check
          python -m ruff check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
          python manage.py migrate --noinput
          python manage.py spectacular --validate --fail-on-warn --file openapi.yaml
      - name: Check de implantação com configuração sintética
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: reali.example.test
          DJANGO_HSTS_SECONDS: "300"
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DJANGO_SECRET_KEY
          python manage.py check --deploy
      - name: Testes PostgreSQL e cobertura
        run: python -m pytest --cov --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Carga sintética opcional
        if: inputs.local_load
        env:
          REALI_RUN_COUNT_LOAD: "1"
          REALI_RUN_QUALITY_LOAD: "1"
        run: python -m pytest -q -s apps/counting/test_load.py apps/api/test_phase10_performance.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-quality
          path: |
            backend/coverage.xml
            backend/junit.xml
            backend/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Testes e cobertura do cliente
        run: |
          npx --no-install tsc -p tsconfig.tests.json
          node --experimental-test-coverage --test-coverage-lines=80 --test-coverage-include='.test-build/**/*.js' --test tests/*.test.cjs
      - run: npx --yes expo-doctor

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Análise de dependências Python
        working-directory: backend
        run: |
          python -m pip install 'bandit>=1.9,<2' 'pip-audit>=2.10,<3'
          python -m pip_audit --strict -r requirements.txt
      - name: Análise estática Python
        working-directory: backend
        run: bandit -r apps config -x '*/test_*.py,*/migrations/*' -ll -ii
      - name: Análise de dependências JavaScript
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Detecção de segredos no Git
        run: |
          docker run --rm --volume "$PWD:/repo:ro" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact=100 --no-banner --log-opts=--all /repo

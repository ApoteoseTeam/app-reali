appId: ${APP_ID}
---
- launchApp:
    clearState: true
- assertVisible: "Entrar"
- tapOn:
    id: "welcome-enter"
- tapOn:
    id: "login-email"
- inputText: "mobile-smoke@example.test"
- tapOn:
    id: "login-password"
- inputText: ${REALI_SMOKE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- runFlow:
    when:
      visible: "Organização e escola"
    commands:
      - tapOn: "Escola Mobile"
      - tapOn: "Continuar para o início"
- extendedWaitUntil:
    visible: "Olá, Direção"
    timeout: 30000
- assertVisible: "Escola Mobile"
- scrollUntilVisible:
    element: "Contagens"
    direction: DOWN
- tapOn: "Contagens"
- extendedWaitUntil:
    visible: "Total de entradas"
    timeout: 30000
- tapOn: "Voltar"
- scrollUntilVisible:
    element: "Merenda"
    direction: DOWN
- tapOn: "Merenda"
- tapOn: "Detalhes do serviço de .*"
- extendedWaitUntil:
    visible: "Iniciar preparo"
    timeout: 30000
- tapOn: "Iniciar preparo"
- extendedWaitUntil:
    visible: "Pratos previstos 20"
    timeout: 30000
- tapOn: "Iniciar distribuição"
- tapOn: "Finalizar serviço"
- tapOn: "Confirmar"
- assertVisible: ".*Finalizado.*"
- tapOn: "Voltar"
- tapOn: "Voltar"
- tapOn: "Relatórios"
- assertVisible: "Relatório"
- tapOn: "Voltar"
- scrollUntilVisible:
    element: "Abrir RealInova"
    direction: DOWN
- tapOn: "Abrir RealInova"
- tapOn: "Nova conversa"
- tapOn:
    id: "chat-message"
- inputText: "Quantos pratos foram servidos ontem?"
- hideKeyboard
- tapOn: "Enviar mensagem"
- extendedWaitUntil:
    visible: ".*pratos servidos 19.*"
    timeout: 45000
- tapOn: "Voltar"
- tapOn: "Voltar"
- tapOn: "Abrir perfil"
- tapOn: "Sair da conta"
- assertVisible: "Entrar"
